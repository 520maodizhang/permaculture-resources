<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>朴门知识库 · 管理 v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g1:#2d7a3e;--g2:#4caf50;--bg:#faf8f1;--card:#fff;--border:#e0ddd5;--text:#2c2416;--muted:#8a8275;--err:#d93025;--warn:#f59e0b}
body{font-family:-apple-system,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text)}
.login{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--card);padding:40px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.08);max-width:500px;width:90%}
.login-box h1{font-size:22px;margin-bottom:4px;color:var(--g1)}
.ver{font-size:11px;color:var(--muted);margin-bottom:12px}
.login-box p{font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.login-box input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:12px}
.login-box input:focus{outline:none;border-color:var(--g2)}
.login-box button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.login-box button:disabled{opacity:.6;cursor:wait}
.login-box a{color:var(--g1);font-size:13px}
.err-msg{font-size:13px;margin-bottom:12px;display:none;padding:10px 14px;border-radius:8px;line-height:1.5;white-space:pre-line}
.err-msg.err{color:var(--err);background:#fce8e6}
.err-msg.ok{color:var(--g1);background:#e6f4ea}
.err-msg.warn{color:var(--warn);background:#fef3e2}
.help-box{margin-top:16px;padding:14px;background:rgba(76,175,80,.05);border-radius:10px;font-size:13px;color:var(--muted);line-height:1.7}
.help-box b{color:var(--g1)}
.help-box code{background:var(--bg);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12px}
.diag-btn{background:var(--card)!important;color:var(--g1)!important;border:2px solid var(--g2)!important;margin-top:8px;font-size:13px!important}
.app{display:none}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h1{font-size:18px;color:var(--g1)}
.topbar .user{font-size:13px;color:var(--muted)}
.topbar button{padding:6px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px;margin-left:12px}
.main{display:flex;height:calc(100vh - 52px)}
.sidebar{width:300px;border-right:1px solid var(--border);overflow-y:auto;padding:16px;background:var(--card);flex-shrink:0}
.sidebar h3{font-size:12px;color:var(--muted);margin:16px 0 6px;text-transform:uppercase;letter-spacing:1px}
.sidebar h3:first-child{margin-top:0}
.file-item{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px}
.file-item:hover{background:rgba(76,175,80,.08)}
.file-item.active{background:rgba(76,175,80,.15);color:var(--g1);font-weight:600}
.new-file{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--g1);border:1px dashed var(--g2);margin-top:6px;text-align:center}
.new-file:hover{background:rgba(76,175,80,.08)}
.sb-err{color:var(--err);font-size:13px;padding:8px 12px}
.editor{flex:1;display:none;flex-direction:column;padding:24px;overflow:hidden}
.editor.show{display:flex}
.ed-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ed-head input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.btn-save{padding:8px 20px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.ed-body{flex:1;display:flex;gap:16px;overflow:hidden}
.ed-body textarea{flex:1;padding:16px;border:1px solid var(--border);border-radius:10px;font-family:'SF Mono','Fira Code',monospace;font-size:14px;line-height:1.6;resize:none;overflow-y:auto;outline:none}
.ed-body textarea:focus{border-color:var(--g2)}
.preview{flex:1;padding:16px;border:1px solid var(--border);border-radius:10px;overflow-y:auto;background:var(--card)}
.preview h1{font-size:22px;margin:16px 0 8px;color:var(--g1)}
.preview h2{font-size:18px;margin:14px 0 6px}
.preview h3{font-size:16px;margin:12px 0 4px}
.preview p{margin:8px 0;line-height:1.7}
.preview ul{margin:8px 0;padding-left:24px}
.preview li{margin:4px 0}
.preview code{background:var(--bg);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13px}
.preview pre{background:var(--bg);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
.preview strong{font-weight:700}
.preview table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px}
.preview th,.preview td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.preview th{background:rgba(76,175,80,.1);font-weight:600;color:var(--g1)}
.preview tr:nth-child(even){background:rgba(0,0,0,.02)}
.preview a{color:var(--g1);text-decoration:underline}
.preview img{max-width:100%;border-radius:8px;margin:8px 0}
.preview blockquote{border-left:3px solid var(--g2);padding-left:12px;margin:8px 0;color:var(--muted)}
.preview hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.preview h4{font-size:15px;margin:10px 0 4px}
.preview h5{font-size:14px;margin:8px 0 4px}
.preview h6{font-size:13px;margin:8px 0 4px;color:var(--muted)}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 24px;border-radius:10px;color:#fff;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;z-index:100}
.toast.ok{background:var(--g1)}
.toast.fail{background:var(--err)}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="login-box">
    <h1>🌳 朴门知识库管理</h1>
    <div class="ver">v3.0 · 如果看不到 v3.0 请强制刷新 Ctrl+Shift+R</div>
    <p>输入 GitHub <b>Personal Access Token</b> 登录。<br>⚠️ 不是密码，是 <code>ghp_</code> 开头的 Token。</p>
    <div class="err-msg" id="loginErr"></div>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" onkeydown="if(event.key==='Enter')doLogin()">
    <button id="loginBtn" onclick="doLogin()">登录</button>
    <button class="diag-btn" onclick="runDiagnostic()">🔍 诊断连接</button>
    <div class="help-box">
      <b>创建 Token：</b>点下面的链接 → 确认勾选 <code>repo</code> → Generate → 复制 <code>ghp_...</code><br>
      <a href="https://github.com/settings/tokens/new?scopes=repo&description=permaculture-cms" target="_blank" style="display:inline-block;margin-top:8px;font-weight:600">→ 创建 Token</a>
    </div>
  </div>
</div>
<div class="app" id="app">
  <div class="topbar">
    <h1>🌳 朴门知识库管理</h1>
    <div style="display:flex;align-items:center">
      <span class="user" id="userInfo"></span>
      <button onclick="logout()">退出</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="editor" id="editor">
      <div class="ed-head">
        <input id="filepath" placeholder="文件路径">
        <button class="btn-save" id="savebtn" onclick="saveFile()">保存</button>
      </div>
      <div class="ed-body">
        <textarea id="content" oninput="renderPreview()" placeholder="Markdown..."></textarea>
        <div class="preview" id="preview"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var REPO='520maodizhang/permaculture-resources',API='https://bskfs7ud-3456.devbridge-s2.hwtunnel.com/api'
var token='',currentSha=null
var dirs=[{path:'',label:'根目录'},{path:'00-foundations',label:'基础理论'},{path:'01-core-texts',label:'核心文献'},{path:'06-reference',label:'参考资料'},{path:'07-learning-paths',label:'学习路径'},{path:'AI-Powered-Agroforestry-Planning-',label:'AI农林业规划'},{path:'CPlant',label:'CPlant'},{path:'Polyculture-Design-Tool',label:'多样性设计工具'},{path:'awesome-permaculture',label:' awesome-permaculture'},{path:'beacon-food-forest',label:'信标食物森林'},{path:'mollison-1981-pdc',label:'Mollison 1981 PDC'},{path:'permaculture-card-deck-printable',label:'朴门卡片牌组'},{path:'permaculture-climate',label:'朴门气候'},{path:'permaculture-pamphlets',label:'朴门小册子'},{path:'planetary-homestead-manifesto',label:'行星家园宣言'},{path:'powerplant',label:'PowerPlant'},{path:'web-resources',label:'网络资源'}]

// 兼容的 fetch with timeout
function fetchTO(url,opts,ms){
  ms=ms||15000
  return new Promise(function(resolve,reject){
    var ctrl=new AbortController()
    var timer=setTimeout(function(){ctrl.abort();reject(new Error('超时'))},ms)
    var o=opts||{}
    o.signal=ctrl.signal
    fetch(url,o).then(function(res){clearTimeout(timer);resolve(res)},function(err){clearTimeout(timer);reject(err)})
  })
}

function showErr(m){var e=document.getElementById('loginErr');e.textContent=m;e.className='err-msg err';e.style.display='block'}
function showOk(m){var e=document.getElementById('loginErr');e.textContent=m;e.className='err-msg ok';e.style.display='block'}
function showWarn(m){var e=document.getElementById('loginErr');e.textContent=m;e.className='err-msg warn';e.style.display='block'}
function logout(){localStorage.removeItem('gh_token');token='';location.reload()}

;(function(){var s=localStorage.getItem('gh_token');if(s){token=s;validateAndShow()}})()

// 诊断：直连测试，显示详细结果
async function runDiagnostic(){
  var lines=['🔍 诊断开始...']
  showWarn(lines.join('\n'))
  // 测试1: 直连 GitHub API (公开接口)
  try{
    var res=await fetchTO(API+'/zen',{},8000)
    if(res.ok){var t=await res.text();lines.push('✅ 直连 GitHub API: 成功 ("'+t.substring(0,30)+'")')}
    else{lines.push('⚠️ 直连 GitHub API: HTTP '+res.status)}
  }catch(e){lines.push('❌ 直连 GitHub API: '+e.message)}
  showWarn(lines.join('\n'))
  // 测试2: 直连带认证 (用当前token)
  var tok=document.getElementById('tokenInput').value.trim()
  if(tok){
    try{
      var res2=await fetchTO(API+'/user',{headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'}},8000)
      if(res2.ok){var u=await res2.json();lines.push('✅ Token 验证: 成功! 用户: '+u.login);showOk(lines.join('\n'));return}
      else{var d=await res2.json().catch(function(){return{}});lines.push('❌ Token 验证: HTTP '+res2.status+' '+(d.message||''))}
    }catch(e){lines.push('❌ Token 验证: '+e.message)}
  }else{lines.push('⏭️ Token 验证: 跳过(未输入token)')}
  showWarn(lines.join('\n'))
  // 测试3: CORS 检查
  try{
    var res3=await fetchTO(API+'/zen',{method:'OPTIONS',headers:{'Origin':'https://permaculture-design.surge.sh'}},5000)
    var aco=res3.headers.get('access-control-allow-origin')
    lines.push(aco?('✅ CORS: 允许 '+aco):('⚠️ CORS: 无 access-control-allow-origin 头'))
  }catch(e){lines.push('⚠️ CORS 检查: '+e.message)}
  var finalMsg=lines.join('\n')
  if(finalMsg.indexOf('✅ Token')>=0){showOk(finalMsg)}else{showErr(finalMsg)}
}
async function doLogin(){
  token=document.getElementById('tokenInput').value.trim()
  if(!token){showErr('请输入 Token');return}
  if(token.indexOf('ghp_')!==0&&token.indexOf('github_pat_')!==0){showErr('Token 格式不对！以 ghp_ 或 github_pat_ 开头，不是密码。');return}
  await validateAndShow()
}

async function validateAndShow(){
  var btn=document.getElementById('loginBtn')
  btn.disabled=true;btn.textContent='验证中...'
  document.getElementById('loginErr').style.display='none'
  try{
    var res=await fetchTO(API+'/user',{
      headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}
    },15000)
    if(!res.ok){
      var d=await res.json().catch(function(){return{}})
      if(res.status===401){showErr('Token 无效或已过期。GitHub 返回: '+(d.message||'Bad credentials')+'\n请确认复制了完整的 ghp_... 字符串。')}
      else if(res.status===403){showErr('Token 权限不足。需勾选 repo 权限。GitHub 返回: '+(d.message||''))}
      else{showErr('GitHub 返回错误 '+res.status+': '+(d.message||''))}
      localStorage.removeItem('gh_token')
      btn.disabled=false;btn.textContent='登录';return
    }
    var user=await res.json()
    localStorage.setItem('gh_token',token)
    document.getElementById('login').style.display='none'
    document.getElementById('app').style.display='block'
    document.getElementById('userInfo').textContent=user.login
    await loadSidebar()
  }catch(e){
    showErr('无法连接 GitHub API: '+e.message+'\n\n可能原因：\n① 浏览器无法访问 api.github.com\n② 网络代理/防火墙拦截\n\n请先点「诊断连接」测试。')
    localStorage.removeItem('gh_token')
    btn.disabled=false;btn.textContent='登录'
  }
}

async function ghApi(path,method,body){
  var o={method:method||'GET',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'}}
  if(body)o.body=JSON.stringify(body)
  return await fetchTO(API+'/repos/'+REPO+'/contents/'+path,o,20000)
}

async function loadSidebar(){
  var sb=document.getElementById('sidebar');sb.innerHTML=''
  for(var i=0;i<dirs.length;i++){
    var dir=dirs[i]
    var h=document.createElement('h3');h.textContent=dir.label;sb.appendChild(h)
    try{
      var res=await ghApi(dir.path)
      if(!res.ok){var e=document.createElement('div');e.className='sb-err';e.textContent='HTTP '+res.status;sb.appendChild(e);continue}
      var items=await res.json()
      if(!Array.isArray(items)){var e2=document.createElement('div');e2.className='sb-err';e2.textContent='非目录';sb.appendChild(e2);continue}
      var mds=items.filter(function(x){return x.type==='file'&&x.name.endsWith('.md')})
      if(!mds.length){var e3=document.createElement('div');e3.style.cssText='font-size:13px;color:#aaa;padding:4px 12px';e3.textContent='（空）';sb.appendChild(e3)}
      for(var j=0;j<mds.length;j++){
        var f=mds[j]
        var el=document.createElement('div');el.className='file-item'
        el.innerHTML='<span>📄</span> '+f.name.replace('.md','')
        ;(function(el,f){el.onclick=function(){document.querySelectorAll('.file-item').forEach(function(x){x.classList.remove('active')});el.classList.add('active');openFile(f.path,f.sha)}})(el,f)
        sb.appendChild(el)
      }
      var nf=document.createElement('div');nf.className='new-file';nf.textContent='+ 新建'
      ;(function(dir){nf.onclick=function(){newFile(dir.path)}})(dir)
      sb.appendChild(nf)
    }catch(e){var el=document.createElement('div');el.className='sb-err';el.textContent=e.message;sb.appendChild(el)}
  }
}

async function openFile(path,sha){
  currentSha=sha
  document.getElementById('editor').classList.add('show')
  document.getElementById('filepath').value=path
  document.getElementById('savebtn').disabled=true
  document.getElementById('content').value='加载中...'
  try{
    var res=await ghApi(path)
    if(res.ok){var d=await res.json();document.getElementById('content').value=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));currentSha=d.sha;renderPreview()}
    else{document.getElementById('content').value='加载失败: '+res.status}
  }catch(e){document.getElementById('content').value='错误: '+e.message}
  document.getElementById('savebtn').disabled=false
}

function newFile(dirPath){
  var name=prompt('文件名（不含.md）:');if(!name)return
  var path=dirPath?dirPath+'/'+name+'.md':name+'.md'
  currentSha=null;document.getElementById('editor').classList.add('show')
  document.getElementById('filepath').value=path
  document.getElementById('content').value='# '+name+'\n\n';renderPreview()
}

async function saveFile(){
  var path=document.getElementById('filepath').value
  var content=document.getElementById('content').value
  var btn=document.getElementById('savebtn');btn.disabled=true;btn.textContent='保存中...'
  try{
    var body={message:'CMS: 更新 '+path,content:btoa(unescape(encodeURIComponent(content)))}
    if(currentSha)body.sha=currentSha
    var res=await ghApi(path,'PUT',body)
    if(res.ok){var d=await res.json();currentSha=d.content.sha;showToast('✅ 已提交','ok');await loadSidebar()}
    else{var e=await res.json().catch(function(){return{}});showToast('❌ '+(e.message||'失败'),'fail')}
  }catch(e){showToast('❌ '+e.message,'fail')}
  btn.disabled=false;btn.textContent='保存'
}

function renderPreview(){
  var md=document.getElementById('content').value
  var lines=md.split('\n')
  var html=''
  var i=0
  while(i<lines.length){
    var line=lines[i]
    // Table detection
    if(line.trim().startsWith('|')&&i+1<lines.length&&lines[i+1].trim().match(/^\|[\s\-:|]+\|$/)){
      var headers=line.trim().split('|').filter(function(x,i,a){return i>0&&i<a.length-1}).map(function(x){return x.trim()})
      i+=2 // skip header and separator
      html+='<table><thead><tr>'
      headers.forEach(function(h){html+='<th>'+escMd(h)+'</th>'})
      html+='</tr></thead><tbody>'
      while(i<lines.length&&lines[i].trim().startsWith('|')){
        var cells=lines[i].trim().split('|').filter(function(x,i,a){return i>0&&i<a.length-1}).map(function(x){return x.trim()})
        html+='<tr>'
        cells.forEach(function(c){html+='<td>'+escMd(c)+'</td>'})
        html+='</tr>'
        i++
      }
      html+='</tbody></table>'
      continue
    }
    // Headers
    if(line.match(/^#{1,6} /)){
      var lvl=line.match(/^#+/)[0].length
      var txt=line.replace(/^#+ /,'')
      html+='<h'+lvl+'>'+escMd(txt)+'</h'+lvl+'>'
      i++;continue
    }
    // Horizontal rule
    if(line.trim().match(/^(-{3,}|\*{3,}|_{3,})$/)){html+='<hr>';i++;continue}
    // Blockquote
    if(line.startsWith('> ')){
      var bq=''
      while(i<lines.length&&lines[i].startsWith('> ')){bq+=escMd(lines[i].substring(2))+' ';i++}
      html+='<blockquote>'+bq.trim()+'</blockquote>'
      continue
    }
    // Unordered list
    if(line.match(/^[\-\*\+] /)){
      html+='<ul>'
      while(i<lines.length&&lines[i].match(/^[\-\*\+] /)){html+='<li>'+escMd(lines[i].replace(/^[\-\*\+] /,''))+'</li>';i++}
      html+='</ul>'
      continue
    }
    // Ordered list
    if(line.match(/^\d+\. /)){
      html+='<ol>'
      while(i<lines.length&&lines[i].match(/^\d+\. /)){html+='<li>'+escMd(lines[i].replace(/^\d+\. /,''))+'</li>';i++}
      html+='</ol>'
      continue
    }
    // Code block
    if(line.trim().startsWith('```')){
      var code=''
      i++
      while(i<lines.length&&!lines[i].trim().startsWith('```')){code+=lines[i]+'\n';i++}
      i++ // skip closing ```
      html+='<pre><code>'+escHtml(code)+'</code></pre>'
      continue
    }
    // Empty line
    if(line.trim()===''){i++;continue}
    // Normal paragraph
    var para=''
    while(i<lines.length&&lines[i].trim()!==''&&!lines[i].match(/^#{1,6} /)&&!lines[i].trim().startsWith('|')&&!lines[i].match(/^[\-\*\+] /)&&!lines[i].match(/^\d+\. /)&&!lines[i].startsWith('> ')&&!lines[i].trim().startsWith('```')&&!lines[i].trim().match(/^(-{3,}|\*{3,}|_{3,})$/)){
      para+=lines[i]+' ';i++
    }
    if(para)html+='<p>'+escMd(para.trim())+'</p>'
  }
  document.getElementById('preview').innerHTML=html
}
function escMd(s){
  return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}


function showToast(msg,type){
  var t=document.getElementById('toast')
  t.textContent=msg;t.className='toast '+type;t.style.display='block'
  setTimeout(function(){t.style.display='none'},3000)
}
</script>
</body>
</html>
