<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朴门知识库 · 管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g1:#2d7a3e;--g2:#4caf50;--bg:#faf8f1;--card:#fff;--border:#e0ddd5;--text:#2c2416;--muted:#8a8275;--err:#d93025}
body{font-family:-apple-system,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text)}
.login{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--card);padding:40px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.08);max-width:440px;width:90%}
.login-box h1{font-size:22px;margin-bottom:8px;color:var(--g1)}
.login-box p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.login-box input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:12px}
.login-box input:focus{outline:none;border-color:var(--g2)}
.login-box button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.login-box button:disabled{opacity:.6;cursor:wait}
.login-box a{color:var(--g1);font-size:13px}
.err-msg{color:var(--err);font-size:13px;margin-bottom:12px;display:none;padding:8px 12px;background:#fce8e6;border-radius:8px}
.app{display:none}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h1{font-size:18px;color:var(--g1)}
.topbar .user{font-size:13px;color:var(--muted)}
.topbar button{padding:6px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px;margin-left:12px}
.main{display:flex;height:calc(100vh - 52px)}
.sidebar{width:300px;border-right:1px solid var(--border);overflow-y:auto;padding:16px;background:var(--card);flex-shrink:0}
.sidebar h3{font-size:12px;color:var(--muted);margin:16px 0 6px;text-transform:uppercase;letter-spacing:1px}
.sidebar h3:first-child{margin-top:0}
.file-item{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px}
.file-item:hover{background:rgba(76,175,80,.08)}
.file-item.active{background:rgba(76,175,80,.15);color:var(--g1);font-weight:600}
.new-file{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--g1);border:1px dashed var(--g2);margin-top:6px;text-align:center}
.new-file:hover{background:rgba(76,175,80,.08)}
.sb-err{color:var(--err);font-size:13px;padding:8px 12px}
.editor{flex:1;display:none;flex-direction:column;padding:24px;overflow:hidden}
.editor.show{display:flex}
.ed-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ed-head input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.btn-save{padding:8px 20px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.ed-body{flex:1;display:flex;gap:16px;overflow:hidden}
.ed-body textarea{flex:1;padding:16px;border:1px solid var(--border);border-radius:10px;font-family:'SF Mono','Fira Code',monospace;font-size:14px;line-height:1.6;resize:none;overflow-y:auto;outline:none}
.ed-body textarea:focus{border-color:var(--g2)}
.preview{flex:1;padding:16px;border:1px solid var(--border);border-radius:10px;overflow-y:auto;background:var(--card)}
.preview h1{font-size:22px;margin:16px 0 8px;color:var(--g1)}
.preview h2{font-size:18px;margin:14px 0 6px}
.preview h3{font-size:16px;margin:12px 0 4px}
.preview p{margin:8px 0;line-height:1.7}
.preview ul{margin:8px 0;padding-left:24px}
.preview li{margin:4px 0}
.preview code{background:var(--bg);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13px}
.preview pre{background:var(--bg);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
.preview strong{font-weight:700}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 24px;border-radius:10px;color:#fff;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;z-index:100}
.toast.ok{background:var(--g1)}
.toast.fail{background:var(--err)}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="login-box">
    <h1>🌳 朴门知识库管理</h1>
    <p>输入 GitHub Personal Access Token 登录。<br>Token 只存在浏览器本地。</p>
    <div class="err-msg" id="loginErr"></div>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" onkeydown="if(event.key==='Enter')doLogin()">
    <button id="loginBtn" onclick="doLogin()">登录</button>
    <p style="margin-top:16px"><a href="https://github.com/settings/tokens/new?scopes=repo&description=permaculture-cms" target="_blank">→ 点这里创建 Token（勾选 repo 权限）</a></p>
  </div>
</div>
<div class="app" id="app">
  <div class="topbar">
    <h1>🌳 朴门知识库管理</h1>
    <div style="display:flex;align-items:center">
      <span class="user" id="userInfo"></span>
      <button onclick="logout()">退出</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="editor" id="editor">
      <div class="ed-head">
        <input id="filepath" placeholder="文件路径">
        <button class="btn-save" id="savebtn" onclick="saveFile()">保存</button>
      </div>
      <div class="ed-body">
        <textarea id="content" oninput="renderPreview()" placeholder="Markdown..."></textarea>
        <div class="preview" id="preview"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const REPO='520maodizhang/permaculture-resources',API='https://api.github.com'
let token='',currentSha=null
const dirs=[{path:'',label:'根目录'},{path:'00-foundations',label:'基础理论'},{path:'01-core-texts',label:'核心文献'},{path:'06-reference',label:'参考'},{path:'07-learning-paths',label:'学习路径'}]

;(function(){const s=localStorage.getItem('gh_token');if(s){token=s;validateAndShow()}})()

async function doLogin(){
  token=document.getElementById('tokenInput').value.trim()
  if(!token){showErr('请输入 Token');return}
  await validateAndShow()
}

async function validateAndShow(){
  const btn=document.getElementById('loginBtn'),err=document.getElementById('loginErr')
  btn.disabled=true;btn.textContent='验证中...';err.style.display='none'
  try{
    const res=await fetch(API+'/user',{headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}})
    if(!res.ok){const d=await res.json().catch(()=>({}));showErr('Token 无效: '+(d.message||res.status));btn.disabled=false;btn.textContent='登录';return}
    const user=await res.json()
    localStorage.setItem('gh_token',token)
    document.getElementById('login').style.display='none'
    document.getElementById('app').style.display='block'
    document.getElementById('userInfo').textContent='👤 '+user.login
    await loadSidebar()
  }catch(e){showErr('网络错误: '+e.message);btn.disabled=false;btn.textContent='登录'}
}

function showErr(m){const e=document.getElementById('loginErr');e.textContent=m;e.style.display='block'}
function logout(){localStorage.removeItem('gh_token');token='';location.reload()}

async function ghApi(path,method='GET',body=null){
  const opts={method,headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'}}
  if(body)opts.body=JSON.stringify(body)
  return await fetch(API+'/repos/'+REPO+'/contents/'+path,opts)
}

async function loadSidebar(){
  const sb=document.getElementById('sidebar');sb.innerHTML=''
  for(const dir of dirs){
    const h=document.createElement('h3');h.textContent=dir.label;sb.appendChild(h)
    try{
      const res=await ghApi(dir.path)
      if(!res.ok){const e=document.createElement('div');e.className='sb-err';e.textContent='HTTP '+res.status;sb.appendChild(e);continue}
      const items=await res.json()
      if(!Array.isArray(items)){const e=document.createElement('div');e.className='sb-err';e.textContent='非目录';sb.appendChild(e);continue}
      const mds=items.filter(i=>i.type==='file'&&i.name.endsWith('.md'))
      if(mds.length===0){const e=document.createElement('div');e.style.cssText='font-size:13px;color:#aaa;padding:4px 12px';e.textContent='（空）';sb.appendChild(e)}
      for(const f of mds){
        const el=document.createElement('div');el.className='file-item'
        el.innerHTML='<span>📄</span> '+f.name.replace('.md','')
        el.onclick=()=>{document.querySelectorAll('.file-item').forEach(x=>x.classList.remove('active'));el.classList.add('active');openFile(f.path,f.sha)}
        sb.appendChild(el)
      }
      const nf=document.createElement('div');nf.className='new-file';nf.textContent='+ 新建';nf.onclick=()=>newFile(dir.path);sb.appendChild(nf)
    }catch(e){const el=document.createElement('div');el.className='sb-err';el.textContent=e.message;sb.appendChild(el)}
  }
}

async function openFile(path,sha){
  currentSha=sha
  document.getElementById('editor').classList.add('show')
  document.getElementById('filepath').value=path
  document.getElementById('savebtn').disabled=true
  document.getElementById('content').value='加载中...'
  try{
    const res=await ghApi(path)
    if(res.ok){const d=await res.json();document.getElementById('content').value=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));currentSha=d.sha;renderPreview()}
    else{document.getElementById('content').value='加载失败: '+res.status}
  }catch(e){document.getElementById('content').value='错误: '+e.message}
  document.getElementById('savebtn').disabled=false
}

function newFile(dir){
  const name=prompt('文件名（不含.md）:');if(!name)return
  const path=dir?dir+'/'+name+'.md':name+'.md'
  currentSha=null;document.getElementById('editor').classList.add('show')
  document.getElementById('filepath').value=path
  document.getElementById('content').value='# '+name+'\n\n';renderPreview()
}

async function saveFile(){
  const path=document.getElementById('filepath').value,content=document.getElementById('content').value
  const btn=document.getElementById('savebtn');btn.disabled=true;btn.textContent='保存中...'
  try{
    const body={message:'CMS: 更新 '+path,content:btoa(unescape(encodeURIComponent(content)))}
    if(currentSha)body.sha=currentSha
    const res=await ghApi(path,'PUT',body)
    if(res.ok){const d=await res.json();currentSha=d.content.sha;showToast('✅ 已提交到 GitHub','ok');await loadSidebar()}
    else{const e=await res.json().catch(()=>({}));showToast('❌ '+(e.message||'失败'),'fail')}
  }catch(e){showToast('❌ '+e.message,'fail')}
  btn.disabled=false;btn.textContent='保存'
}

function renderPreview(){
  let md=document.getElementById('content').value
  let html=md
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^\- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n\n/g,'</p><p>')
  document.getElementById('preview').innerHTML='<p>'+html+'</p>'
}

function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
</script>
</body>
</html>
