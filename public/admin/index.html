<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🌳 朴门知识库管理 v4.0</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@11/dist/easymde.min.css">
<style>
:root {
  --primary: #2d7a3e; --secondary: #4caf50; --bg: #faf8f1; --card: #ffffff;
  --border: #e0ddd5; --text: #2c2416; --muted: #8a8275; --error: #d93025;
  --warning: #f59e0b; --success: #2d7a3e; --sidebar-w: 280px; --topbar-h: 56px;
  --tab-h: 44px; --radius: 8px; --shadow: 0 2px 8px rgba(0,0,0,.08); --shadow-lg: 0 4px 20px rgba(0,0,0,.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; }
a { color:var(--primary); text-decoration:none; } a:hover { text-decoration:underline; }
button { cursor:pointer; font-family:inherit; font-size:inherit; border:none; background:none; }
input,textarea,select { font-family:inherit; font-size:inherit; }
::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:#ccc; border-radius:4px; }

#login-page { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#2d7a3e 0%,#1a5c2a 100%); }
.login-card { background:var(--card); border-radius:16px; padding:40px; width:440px; max-width:90vw; box-shadow:var(--shadow-lg); }
.login-card h1 { font-size:24px; text-align:center; margin-bottom:8px; }
.login-card .subtitle { text-align:center; color:var(--muted); margin-bottom:28px; font-size:13px; }
.login-card label { display:block; margin-bottom:6px; font-weight:600; font-size:13px; }
.login-card input[type=password] { width:100%; padding:10px 14px; border:2px solid var(--border); border-radius:var(--radius); margin-bottom:16px; transition:border-color .2s; }
.login-card input[type=password]:focus { outline:none; border-color:var(--primary); }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:var(--radius); font-weight:600; transition:all .2s; white-space:nowrap; }
.btn-primary { background:var(--primary); color:#fff; } .btn-primary:hover { background:#246830; }
.btn-secondary { background:var(--secondary); color:#fff; } .btn-secondary:hover { background:#3d9b4a; }
.btn-outline { border:2px solid var(--border); color:var(--text); background:var(--card); } .btn-outline:hover { border-color:var(--primary); color:var(--primary); }
.btn-danger { background:var(--error); color:#fff; } .btn-danger:hover { background:#b3261e; }
.btn-sm { padding:4px 10px; font-size:12px; } .btn-block { width:100%; justify-content:center; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.login-card .btn-block { margin-bottom:12px; }
.login-help { text-align:center; margin-top:16px; font-size:12px; color:var(--muted); }
.diag-result { margin-top:12px; padding:12px; border-radius:var(--radius); font-size:12px; display:none; }
.diag-result.show { display:block; }
.diag-result.ok { background:#e8f5e9; color:var(--success); } .diag-result.err { background:#fce8e6; color:var(--error); }

#app { display:none; height:100vh; flex-direction:column; }
#app.show { display:flex; }
.topbar { height:var(--topbar-h); background:var(--primary); color:#fff; display:flex; align-items:center; padding:0 20px; box-shadow:var(--shadow); z-index:100; }
.topbar .logo { font-size:18px; font-weight:700; margin-right:auto; }
.topbar .user-info { display:flex; align-items:center; gap:12px; font-size:13px; }
.topbar .user-info img { width:32px; height:32px; border-radius:50%; }
.topbar .logout-btn { background:rgba(255,255,255,.2); color:#fff; padding:6px 14px; border-radius:var(--radius); font-size:13px; } .topbar .logout-btn:hover { background:rgba(255,255,255,.3); }
.tab-nav { height:var(--tab-h); background:var(--card); border-bottom:1px solid var(--border); display:flex; padding:0 20px; gap:4px; }
.tab-nav button { padding:0 20px; height:100%; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; transition:all .2s; }
.tab-nav button:hover { color:var(--text); } .tab-nav button.active { color:var(--primary); border-bottom-color:var(--primary); }
.tab-content { flex:1; overflow:auto; padding:24px; }
.tab-pane { display:none; } .tab-pane.active { display:block; }

.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
.stat-card .stat-icon { font-size:28px; margin-bottom:8px; }
.stat-card .stat-value { font-size:28px; font-weight:700; color:var(--primary); }
.stat-card .stat-label { color:var(--muted); font-size:13px; margin-top:4px; }
.section-title { font-size:16px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.section-title .actions { margin-left:auto; display:flex; gap:8px; }
.card { background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:20px; }
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; }
th { font-weight:700; color:var(--muted); font-size:12px; text-transform:uppercase; }
.status-badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; }
.status-empty { background:#fce8e6; color:var(--error); } .status-partial { background:#fef7e0; color:var(--warning); } .status-good { background:#e8f5e9; color:var(--success); }
.gap-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
.gap-item { background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); text-align:center; position:relative; }
.gap-item .gap-dot { font-size:20px; } .gap-item .gap-name { font-weight:600; margin:6px 0 2px; } .gap-item .gap-count { color:var(--muted); font-size:12px; }
.gap-item .gap-priority { margin-top:8px; } .gap-item select { font-size:11px; padding:2px 6px; border:1px solid var(--border); border-radius:4px; }
.recent-list { list-style:none; } .recent-list li { padding:10px 0; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; font-size:13px; }
.recent-list li:last-child { border-bottom:none; }
.recent-list .commit-msg { flex:1; } .recent-list .commit-meta { color:var(--muted); font-size:12px; white-space:nowrap; }
.quick-actions { display:flex; gap:12px; flex-wrap:wrap; }
.suggestion-box { background:#fff8e1; border:1px solid #ffe082; border-radius:var(--radius); padding:14px 18px; margin-bottom:20px; }
.suggestion-box h4 { margin-bottom:6px; } .suggestion-box ul { padding-left:20px; } .suggestion-box li { margin-bottom:4px; }

.content-layout { display:flex; gap:0; height:calc(100vh - var(--topbar-h) - var(--tab-h) - 48px); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); background:var(--card); }
.content-sidebar { width:var(--sidebar-w); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
.sidebar-search { padding:10px; border-bottom:1px solid var(--border); position:relative; }
.sidebar-search input { width:100%; padding:8px 12px 8px 32px; border:1px solid var(--border); border-radius:var(--radius); }
.sidebar-search .search-icon { position:absolute; left:20px; top:50%; transform:translateY(-50%); color:var(--muted); }
.sidebar-tree { flex:1; overflow-y:auto; padding:4px 0; }
.tree-dir { } .tree-dir-header { display:flex; align-items:center; padding:6px 10px; cursor:pointer; font-weight:600; font-size:13px; transition:background .15s; }
.tree-dir-header:hover { background:#f5f3ed; } .tree-dir-header .chevron { font-size:10px; margin-right:6px; transition:transform .2s; width:12px; }
.tree-dir.collapsed .chevron { transform:rotate(-90deg); } .tree-dir-header .dir-icon { margin-right:6px; }
.tree-dir-header .new-btn { margin-left:auto; opacity:0; transition:opacity .15s; font-size:16px; color:var(--primary); padding:0 4px; }
.tree-dir-header:hover .new-btn { opacity:1; }
.tree-dir-children { overflow:hidden; } .tree-dir.collapsed .tree-dir-children { display:none; }
.tree-file { display:flex; align-items:center; padding:5px 10px 5px 34px; cursor:pointer; font-size:13px; transition:background .15s; }
.tree-file:hover { background:#f5f3ed; } .tree-file.active { background:#e8f5e9; color:var(--primary); font-weight:600; }
.tree-file .file-icon { margin-right:6px; } .tree-file .file-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tree-file .file-menu { opacity:0; margin-left:auto; } .tree-file:hover .file-menu { opacity:1; }
.search-results { padding:4px 10px; } .search-result-item { padding:8px 10px; border-radius:4px; cursor:pointer; margin-bottom:4px; }
.search-result-item:hover { background:#f5f3ed; } .search-result-item .sr-file { font-weight:600; font-size:13px; }
.search-result-item .sr-snippet { font-size:12px; color:var(--muted); margin-top:2px; }
.search-result-item mark { background:#fff3cd; padding:0 2px; border-radius:2px; }
.content-main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.content-placeholder { display:flex; align-items:center; justify-content:center; flex:1; color:var(--muted); font-size:16px; flex-direction:column; gap:12px; }
.editor-header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; background:var(--card); }
.editor-path { flex:1; font-size:13px; color:var(--muted); } .editor-path input { border:1px solid var(--border); border-radius:4px; padding:4px 8px; font-size:13px; width:100%; }
.editor-body { flex:1; display:flex; overflow:hidden; }
.frontmatter-form { padding:12px 16px; border-bottom:1px solid var(--border); background:#f9f7f0; }
.frontmatter-form h4 { margin-bottom:8px; font-size:13px; } .frontmatter-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.frontmatter-grid .fm-field { display:flex; flex-direction:column; gap:4px; } .frontmatter-grid label { font-size:12px; color:var(--muted); }
.frontmatter-grid input, .frontmatter-grid textarea { padding:6px 8px; border:1px solid var(--border); border-radius:4px; font-size:13px; }
.frontmatter-grid .fm-full { grid-column:1/-1; }
.editor-split { flex:1; display:flex; overflow:hidden; }
.editor-col { flex:1; overflow:hidden; display:flex; flex-direction:column; } .editor-col + .editor-col { border-left:1px solid var(--border); }
.preview-col { overflow-y:auto; padding:16px; } .preview-col h1 { font-size:24px; margin:16px 0 8px; } .preview-col h2 { font-size:20px; margin:14px 0 6px; }
.preview-col h3 { font-size:16px; margin:12px 0 4px; } .preview-col p { margin:8px 0; } .preview-col ul,.preview-col ol { margin:8px 0; padding-left:24px; }
.preview-col code { background:#f0ede5; padding:2px 6px; border-radius:3px; font-family:monospace; font-size:13px; }
.preview-col pre { background:#2c2416; color:#e8e4dc; padding:12px; border-radius:6px; overflow-x:auto; margin:8px 0; }
.preview-col pre code { background:none; color:inherit; padding:0; }
.preview-col blockquote { border-left:4px solid var(--secondary); padding:8px 16px; margin:8px 0; background:#f9f7f0; color:var(--muted); }
.preview-col table { border:1px solid var(--border); margin:8px 0; } .preview-col th,.preview-col td { border:1px solid var(--border); }
.preview-col img { max-width:100%; border-radius:6px; } .preview-col hr { border:none; border-top:2px solid var(--border); margin:16px 0; }
.preview-col a { color:var(--primary); }
.auto-save-indicator { font-size:12px; color:var(--muted); }
.draft-indicator { font-size:12px; padding:2px 8px; border-radius:10px; background:#fff3cd; color:#856404; }
.EasyMDEContainer { flex:1; display:flex; flex-direction:column; } .EasyMDEContainer .CodeMirror { flex:1; border-radius:0; }
.editor-toolbar-extra { display:flex; gap:8px; align-items:center; }

.media-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; }
.media-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; transition:transform .2s; }
.media-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.media-card img { width:100%; height:140px; object-fit:cover; display:block; cursor:pointer; }
.media-card .media-info { padding:10px 12px; }
.media-card .media-name { font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.media-card .media-size { font-size:11px; color:var(--muted); margin-top:2px; }
.media-card .media-actions { display:flex; gap:4px; padding:0 12px 10px; }
.media-card .media-actions button { font-size:11px; padding:3px 8px; border:1px solid var(--border); border-radius:4px; color:var(--muted); } .media-card .media-actions button:hover { border-color:var(--primary); color:var(--primary); }
.upload-zone { border:3px dashed var(--border); border-radius:var(--radius); padding:40px; text-align:center; margin-bottom:20px; transition:all .2s; cursor:pointer; background:var(--card); }
.upload-zone.dragover { border-color:var(--primary); background:#e8f5e9; }
.upload-zone .upload-icon { font-size:48px; color:var(--muted); margin-bottom:12px; }
.upload-progress { margin-top:12px; } .upload-progress-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.upload-progress-fill { height:100%; background:var(--primary); transition:width .3s; }
.filter-bar { display:flex; gap:12px; margin-bottom:16px; align-items:center; }
.filter-bar input { padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius); flex:1; max-width:300px; }

.settings-section { background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:20px; }
.settings-section h3 { margin-bottom:12px; font-size:16px; }
.config-editor { width:100%; min-height:300px; padding:12px; border:1px solid var(--border); border-radius:var(--radius); font-family:monospace; font-size:13px; resize:vertical; }
.template-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.template-card { border:2px solid var(--border); border-radius:var(--radius); padding:16px; cursor:pointer; transition:all .2s; }
.template-card:hover { border-color:var(--primary); } .template-card.selected { border-color:var(--primary); background:#e8f5e9; }
.template-card h4 { margin-bottom:6px; } .template-card p { font-size:12px; color:var(--muted); }
.deploy-status { padding:12px 16px; border-radius:var(--radius); margin-bottom:12px; } .deploy-status.idle { background:#f5f3ed; } .deploy-status.running { background:#e3f2fd; } .deploy-status.success { background:#e8f5e9; } .deploy-status.failed { background:#fce8e6; }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:1000; }
.modal-overlay.show { display:flex; }
.modal { background:var(--card); border-radius:12px; padding:24px; width:500px; max-width:90vw; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-lg); }
.modal-lg { width:800px; } .modal h2 { font-size:18px; margin-bottom:16px; }
.modal-body { margin-bottom:20px; } .modal-footer { display:flex; gap:10px; justify-content:flex-end; }
.modal .close-btn { position:absolute; top:16px; right:20px; font-size:24px; color:var(--muted); } .modal .close-btn:hover { color:var(--text); }
.diff-view { font-family:monospace; font-size:12px; } .diff-line { padding:2px 8px; white-space:pre-wrap; word-break:break-all; }
.diff-add { background:#e6ffed; color:#22863a; } .diff-del { background:#ffebe9; color:#cb2415; } .diff-ctx { color:var(--muted); }
.commit-list { list-style:none; } .commit-list li { padding:12px 0; border-bottom:1px solid var(--border); }
.commit-list .commit-msg { font-weight:600; font-size:13px; } .commit-list .commit-meta { font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:12px; align-items:center; }
.commit-list .commit-actions { margin-left:auto; display:flex; gap:6px; }

#toast-container { position:fixed; bottom:24px; right:24px; z-index:2000; display:flex; flex-direction:column; gap:8px; }
.toast { background:var(--card); border-radius:var(--radius); padding:12px 20px; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; min-width:280px; animation:slideIn .3s ease; border-left:4px solid var(--primary); }
.toast.success { border-left-color:var(--success); } .toast.error { border-left-color:var(--error); } .toast.warning { border-left-color:var(--warning); }
.toast .toast-icon { font-size:18px; } .toast .toast-msg { flex:1; font-size:13px; }
@keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
.context-menu { position:fixed; background:var(--card); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow-lg); z-index:999; display:none; min-width:160px; padding:4px 0; }
.context-menu.show { display:block; } .context-menu button { display:block; width:100%; text-align:left; padding:8px 16px; font-size:13px; } .context-menu button:hover { background:#f5f3ed; }
.context-menu .divider { height:1px; background:var(--border); margin:4px 0; }
.loading { display:inline-block; width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-overlay { position:fixed; inset:0; background:rgba(255,255,255,.7); display:none; align-items:center; justify-content:center; z-index:1500; } .loading-overlay.show { display:flex; }
.loading-overlay .loading-box { text-align:center; } .loading-overlay .loading-text { margin-top:12px; color:var(--muted); }
@media(max-width:768px) { .content-sidebar { width:220px; } .editor-split { flex-direction:column; } .preview-col { border-left:none; border-top:1px solid var(--border); } }


</style>
</head>
<body>
<!--BODY-->
<div id="login-page">
  <div class="login-card">
    <h1>🌳 朴门知识库管理</h1>
    <p class="subtitle">v4.0 · 通过 GitHub API 管理内容</p>
    <label>GitHub Personal Access Token</label>
    <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
    <button class="btn btn-primary btn-block" onclick="doLogin()">登录</button>
    <button class="btn btn-outline btn-block" onclick="runDiagnostics()">诊断连接</button>
    <div class="diag-result" id="diag-result"></div>
    <div class="login-help">
      需要具有 <code>repo</code> 权限的 Token ·
      <a href="https://github.com/settings/tokens/new?scopes=repo&description=permaculture-cms" target="_blank">创建 Token →</a>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="logo">🌳 朴门知识库管理 v4.0</div>
    <div class="user-info">
      <img id="user-avatar" src="" alt="">
      <span id="user-name"></span>
      <button class="logout-btn" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="tab-nav">
    <button class="active" data-tab="dashboard" onclick="switchTab('dashboard')">仪表盘</button>
    <button data-tab="content" onclick="switchTab('content')">内容管理</button>
    <button data-tab="media" onclick="switchTab('media')">媒体库</button>
    <button data-tab="settings" onclick="switchTab('settings')">设置</button>
  </div>
  <div class="tab-content">
    <div class="tab-pane active" id="pane-dashboard"></div>
    <div class="tab-pane" id="pane-content">
      <div class="content-layout">
        <div class="content-sidebar">
          <div class="sidebar-search">
            <span class="search-icon">🔍</span>
            <input type="text" id="sidebar-search-input" placeholder="搜索文件内容..." oninput="handleSidebarSearch(this.value)">
          </div>
          <div class="sidebar-tree" id="sidebar-tree"></div>
        </div>
        <div class="content-main" id="content-main">
          <div class="content-placeholder">
            <div style="font-size:48px">📄</div>
            <div>选择左侧文件开始编辑</div>
          </div>
        </div>
      </div>
    </div>
    <div class="tab-pane" id="pane-media"></div>
    <div class="tab-pane" id="pane-settings"></div>
  </div>
</div>

<div id="toast-container"></div>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-box" style="position:relative"></div></div>
<div class="context-menu" id="context-menu"></div>
<div class="loading-overlay" id="loading-overlay"><div class="loading-box"><div class="loading" style="width:32px;height:32px"></div><div class="loading-text" id="loading-text">加载中...</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/easymde@11/dist/easymde.min.js"></script>
<script>
/*JS1*/
const REPO = '520maodizhang/permaculture-resources';
const API = 'https://gh-proxy-permaculture.netlify.app/api';
const RAW_BASE = 'https://raw.githubusercontent.com/' + REPO + '/main/';
const DIRS = [
  {path:'00-foundations', name:'基础理论', icon:'📚'},
  {path:'01-core-texts', name:'核心文献', icon:'📖'},
  {path:'02-design-elements', name:'设计要素', icon:'🌿'},
  {path:'03-design-process', name:'设计流程', icon:'🔄'},
  {path:'04-regional-adaptations', name:'区域适配', icon:'🌍'},
  {path:'05-community-social', name:'社区与社会朴门', icon:'👥'},
  {path:'06-reference', name:'参考资料', icon:'📋'},

function apiFetch(path, options = {}) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), options.timeout || 18000);
  const headers = { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', ...(options.headers || {}) };
  if (options.body && typeof options.body === 'object') { headers['Content-Type'] = 'application/json'; options.body = JSON.stringify(options.body); }
  return fetch(API + path, { ...options, headers, signal: controller.signal }).finally(() => clearTimeout(timeout));
}

function b64decode(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g,'')))); }

  el.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ️'}</span><span class="toast-msg">${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(100%)'; setTimeout(()=>el.remove(),300); }, 3500);
}

async function fetchDirContents(path, node) {
  const res = await apiFetch('/repos/' + REPO + '/contents/' + path);
  if (!res.ok) return;
  const items = await res.json();
  if (!Array.isArray(items)) return;
  for (const item of items) {
    if (item.type === 'dir') {
      const child = { name: item.name, path: item.path, dirs: [], files: [] };
      node.dirs.push(child);
      await fetchDirContents(item.path, child);
    } else if (item.type === 'file' && item.name.endsWith('.md')) {
      node.files.push({ name: item.name, path: item.path, sha: item.sha, size: item.size });
    }
  }
}

async function indexNodeFiles(node) {

function handleSidebarSearch(query) {
  const treeEl = document.getElementById('sidebar-tree');
  query = query.trim().toLowerCase();
  if (!query) { renderFileTree(); return; }
  let html = '<div class="search-results">';
  let count = 0;
  for (const item of searchIndex) {
    const content = item.content.toLowerCase();
    const idx = content.indexOf(query);
    if (idx >= 0 || item.name.toLowerCase().includes(query)) {
      if (count >= 50) break;
      count++;
      let snippet = '';
      if (idx >= 0) { const start = Math.max(0, idx - 30); snippet = '...' + escapeHtml(item.content.substring(start, idx + query.length + 50)) + '...'; snippet = snippet.replace(new RegExp(escapeHtml(query), 'gi'), m => '<mark>' + m + '</mark>'); }
      html += `<div class="search-result-item" onclick="openFile('${item.path}')"><div class="sr-file">📄 ${escapeHtml(item.name)}</div><div class="sr-snippet">${snippet}</div></div>`;
    }
  }
  html += count === 0 ? '<div style="color:var(--muted);padding:12px">未找到匹配文件</div>' : `<div style="color:var(--muted);padding:8px;font-size:12px">找到 ${count} 个结果</div>`;
  html += '</div>';
  treeEl.innerHTML = html;
}

function parseFrontmatter(content) {
  const match = content.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!match) return { frontmatter: null, body: content };
  const fmText = match[1]; const body = match[2];
  const fm = {};
  fmText.split('\n').forEach(line => {
    const m = line.match(/^(\w+):\s*(.*)$/);
    if (m) {
      let val = m[2].trim();
      if (val.startsWith('[') && val.endsWith(']')) { val = val.slice(1,-1).split(',').map(s=>s.trim().replace(/^["']|["']$/g,'')).filter(s=>s); }
      fm[m[1]] = val;
    }
  });
  return { frontmatter: fm, body };
}
function buildFrontmatter(fm) {
  if (!fm) return '';
  let lines = ['---'];
  for (const [k, v] of Object.entries(fm)) {
    if (Array.isArray(v)) lines.push(`${k}: [${v.join(', ')}]`);
    else lines.push(`${k}: ${v || ''}`);
  }
  lines.push('---', '');
  return lines.join('\n');
}

  main.innerHTML = `<div class="editor-header">
    <div class="editor-path"><input type="text" id="editor-path-input" value="${path}" style="max-width:400px"></div>
    <span class="auto-save-indicator" id="auto-save-indicator"></span>
    <span class="draft-indicator" id="draft-indicator" style="display:none">有草稿更改</span>
    <button class="btn btn-outline btn-sm" onclick="saveDraft()">存为草稿</button>
    <button class="btn btn-outline btn-sm" onclick="showVersionHistory('${path}')">历史</button>
    <button class="btn btn-primary btn-sm" onclick="saveFile()">💾 保存</button>
  </div>
  ${fmHtml}
  <div class="editor-body">
    <div class="editor-split">
      <div class="editor-col"><textarea id="mde-textarea">${escapeHtml(body)}</textarea></div>
      <div class="editor-col"><div class="preview-col" id="preview-panel"></div></div>
    </div>
  </div>`;
  currentEditor = { path, sha, content, frontmatter, body };
  initMarkdownEditor(body);
  updatePreview(body);
  if (autoSaveTimer) clearInterval(autoSaveTimer);
  autoSaveTimer = setInterval(autoSave, 30000);
}
function addFrontmatter() {
  currentEditor.frontmatter = { title: '', order: 1, tags: [], description: '', date: new Date().toISOString().split('T')[0] };
  const newContent = buildFrontmatter(currentEditor.frontmatter) + currentEditor.body;
  renderEditor(currentEditor.path, newContent, currentEditor.sha);
}
function initMarkdownEditor(body) {
  const textarea = document.getElementById('mde-textarea');
  if (typeof EasyMDE !== 'undefined') {
    try {
      easyMDE = new EasyMDE({
        element: textarea, spellChecker: false, autofocus: true,
        toolbar: ['bold','italic','heading','quote','code','link','image','table','unordered-list','ordered-list','|','preview','|',{name:'insert-image',action:()=>insertImageFromLibrary(),className:'fa fa-picture-o',title:'从媒体库插入图片'}],
        renderingConfig: { codeSyntaxHighlighting: true },
      });
      easyMDE.codemirror.on('change', () => { unsavedChanges = true; updatePreview(easyMDE.value()); });
    } catch(e) { easyMDE = null; textarea.value = body; textarea.oninput = () => { unsavedChanges = true; updatePreview(textarea.value); }; }
  } else { textarea.value = body; textarea.style.width = '100%'; textarea.style.minHeight = '400px'; textarea.oninput = () => { unsavedChanges = true; updatePreview(textarea.value); }; }
}
function getEditorContent() {
  const body = easyMDE ? easyMDE.value() : document.getElementById('mde-textarea').value;
  let fm = currentEditor.frontmatter;
  if (fm) {
    const titleEl = document.getElementById('fm-title'); if (titleEl) {
      fm.title = titleEl.value; fm.order = parseInt(document.getElementById('fm-order').value)||1;
      fm.tags = document.getElementById('fm-tags').value.split(',').map(s=>s.trim()).filter(s=>s);
      fm.date = document.getElementById('fm-date').value; fm.description = document.getElementById('fm-description').value;
    }
  }
  return (fm ? buildFrontmatter(fm) : '') + body;
}
function updatePreview(md) { document.getElementById('preview-panel').innerHTML = renderMarkdown(md); }
function renderMarkdown(md) {
  if (!md) return '';
  let html = escapeHtml(md);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (m,lang,code) => `<pre><code>${code}</code></pre>`);
  html = html.replace(/^###### (.+)$/gm, '<h6>$1</h6>').replace(/^##### (.+)$/gm, '<h5>$1</h5>').replace(/^#### (.+)$/gm, '<h4>$1</h4>').replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^\*]+)\*/g, '<em>$1</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
  html = html.replace(/^---$/gm, '<hr>');
  html = html.replace(/^\|(.+)\|$/gm, (m) => { const cells = m.split('|').filter(c=>c.trim()||c==='').map(c=>`<td>${c.trim()}</td>`).join(''); return `<tr>${cells}</tr>`; });
  html = html.replace(/(<tr>[\s\S]*?<\/tr>)/g, '<table>$1</table>');
  html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/\n\n/g, '</p><p>').replace(/^([\s\S]+)$/, '<p>$1</p>');
  return html;
}
function autoSave() {
  if (!currentFile || !unsavedChanges) return;
  const content = getEditorContent();
  localStorage.setItem('draft_' + currentFile, content);
  document.getElementById('auto-save-indicator').textContent = '已自动保存 ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
async function saveFile() {
  if (!currentFile) return;
  showLoading('保存中...');
  try {
    const content = getEditorContent();
    const newPath = document.getElementById('editor-path-input').value.trim();
    const isRename = newPath !== currentFile;
    const body = { message: '更新: ' + (isRename ? newPath : currentFile), content: b64encode(content), sha: currentEditor.sha };
    const res = await apiFetch('/repos/' + REPO + '/contents/' + (isRename ? newPath : currentFile), { method: 'PUT', body });
    if (!res.ok) { const d = await res.json(); throw new Error(d.message || '保存失败'); }
    const data = await res.json();
    if (isRename && newPath !== currentFile) { await apiFetch('/repos/' + REPO + '/contents/' + currentFile, { method: 'DELETE', body: { message: '重命名', sha: currentEditor.sha } }); currentFile = newPath; }
    currentEditor.sha = data.content?.sha || currentEditor.sha;
    unsavedChanges = false;
    localStorage.removeItem('draft_' + currentFile);
    showToast('已保存');
    loadFileTree();
  } catch(e) { showToast(e.message, 'error'); } finally { hideLoading(); }
}
function closeEditor() {
  currentFile = null; currentEditor = null;
  if (easyMDE) { easyMDE.toTextArea(); easyMDE = null; }
  if (autoSaveTimer) { clearInterval(autoSaveTimer); autoSaveTimer = null; }
  document.getElementById('content-main').innerHTML = '<div class="content-placeholder"><div style="font-size:48px">📄</div><div>选择左侧文件开始编辑</div></div>';
}
document.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && e.key === 's') { e.preventDefault(); if (currentFile) saveFile(); } });
window.addEventListener('beforeunload', e => { if (unsavedChanges) { e.preventDefault(); e.returnValue = ''; } });

async function loadMediaLibrary() {
  const pane = document.getElementById('pane-media');
  pane.innerHTML = `<div class="upload-zone" id="upload-zone" onclick="document.getElementById('media-file-input').click()">
    <div class="upload-icon">🖼️</div><div>拖放图片到此处或点击上传</div><div style="font-size:12px;color:var(--muted);margin-top:8px">支持多文件上传</div>
    <input type="file" id="media-file-input" multiple accept="image/*" style="display:none" onchange="handleFileUpload(this.files)">
  </div>
  <div class="filter-bar"><input type="text" id="media-filter" placeholder="🔍 按文件名搜索..." oninput="filterMedia(this.value)"></div>
  <div class="media-grid" id="media-grid"><div class="loading"></div></div>`;
  const zone = document.getElementById('upload-zone');
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('dragover'); };
  zone.ondragleave = () => zone.classList.remove('dragover');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('dragover'); handleFileUpload(e.dataTransfer.files); };
  mediaFiles = [];
  try {
    const res = await apiFetch('/repos/' + REPO + '/contents/' + MEDIA_DIR);
    if (res.ok) { const items = await res.json(); if (Array.isArray(items)) mediaFiles = items.filter(i => i.type === 'file'); }
  } catch(e) {}
  renderMediaGrid(mediaFiles);
}
function renderMediaGrid(files) {
  const grid = document.getElementById('media-grid');
  if (!files.length) { grid.innerHTML = '<div style="color:var(--muted);padding:20px">暂无图片</div>'; return; }
  grid.innerHTML = files.map(f => {
    const url = RAW_BASE + MEDIA_DIR + '/' + f.name;
    return `<div class="media-card"><img src="${url}" alt="${f.name}" onclick="window.open('${url}','_blank')"><div class="media-info"><div class="media-name">${f.name}</div><div class="media-size">${(f.size/1024).toFixed(1)} KB</div></div><div class="media-actions"><button onclick="copyMediaUrl('${f.name}')">复制URL</button><button onclick="insertToEditor('${f.name}')">插入编辑器</button><button onclick="deleteMedia('${f.name}','${f.sha}')">删除</button></div></div>`;
  }).join('');
}
function filterMedia(query) {
  query = query.trim().toLowerCase();
  renderMediaGrid(mediaFiles.filter(f => f.name.toLowerCase().includes(query)));
}
function copyMediaUrl(name) { navigator.clipboard.writeText('/images/' + name).then(() => showToast('已复制: /images/' + name)); }
function insertToEditor(name) {
  if (!easyMDE && !document.getElementById('mde-textarea')) { showToast('请先打开编辑器', 'warning'); return; }
  const md = `![${name}](/images/${name})`;
  if (easyMDE) { const cm = easyMDE.codemirror; cm.replaceSelection(md); } else { const ta = document.getElementById('mde-textarea'); ta.value += md; }
  showToast('已插入');
}
async function handleFileUpload(files) {
  if (!files || !files.length) return;
  for (const file of files) {
    if (!file.type.startsWith('image/')) { showToast(file.name + ' 不是图片', 'warning'); continue; }
    showLoading('上传 ' + file.name + '...');
    try {
      const reader = new FileReader();
      const base64 = await new Promise((resolve, reject) => { reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(file); });
      const path = MEDIA_DIR + '/' + file.name;
      const res = await apiFetch('/repos/' + REPO + '/contents/' + path, { method: 'PUT', body: { message: '上传图片: ' + file.name, content: base64 } });
      if (res.ok) showToast('已上传: ' + file.name); else { const d = await res.json(); throw new Error(d.message || '上传失败'); }
    } catch(e) { showToast(e.message, 'error'); } finally { hideLoading(); }
  }
  loadMediaLibrary();
}
async function deleteMedia(name, sha) {
  closeContextMenu();
  confirmDialog('删除图片', `确定删除 <code>${name}</code> 吗？`, async () => {
    showLoading('删除中...');
    try {
      const res = await apiFetch('/repos/' + REPO + '/contents/' + MEDIA_DIR + '/' + name, { method: 'DELETE', body: { message: '删除图片: ' + name, sha } });
      if (res.ok) { showToast('已删除'); loadMediaLibrary(); } else throw new Error('删除失败');
    } catch(e) { showToast(e.message, 'error'); } finally { hideLoading(); }
  });
}
function insertImageFromLibrary() { switchTab('media'); showToast('点击图片卡片上的"插入编辑器"按钮', 'warning'); }

async function saveDraft() {
  if (!currentFile) return;
  showLoading('保存草稿...');
  try {
    const content = getEditorContent();
    const branchRes = await apiFetch('/repos/' + REPO + '/branches/draft');
    if (!branchRes.ok) {
      const mainRes = await apiFetch('/repos/' + REPO + '/branches/main');
      if (!mainRes.ok) throw new Error('无法获取主分支');
      const mainData = await mainRes.json();
      const createRes = await apiFetch('/repos/' + REPO + '/git/refs', { method: 'POST', body: { ref: 'refs/heads/draft', sha: mainData.commit.sha } });
      if (!createRes.ok) throw new Error('无法创建草稿分支');
    }
    let sha;
    const fileRes = await apiFetch('/repos/' + REPO + '/contents/' + currentFile + '?ref=draft');
    if (fileRes.ok) { const d = await fileRes.json(); sha = d.sha; }
    const res = await apiFetch('/repos/' + REPO + '/contents/' + currentFile, { method: 'PUT', body: { message: '草稿: ' + currentFile, content: b64encode(content), sha, branch: 'draft' } });
    if (!res.ok) { const d = await res.json(); throw new Error(d.message || '保存草稿失败'); }
    showToast('已保存到草稿分支');
    unsavedChanges = false;
  } catch(e) { showToast(e.message, 'error'); } finally { hideLoading(); }
}
async function loadDraftStatus(path) {
  try {
    const res = await apiFetch('/repos/' + REPO + '/contents/' + path + '?ref=draft');
    if (res.ok) {
      const draftData = await res.json();
      const draftContent = b64decode(draftData.content) || '';
      if (draftContent !== currentEditor.content) { const el = document.getElementById('draft-indicator'); if (el) el.style.display = 'inline-block'; }
    }
  } catch(e) {}
}
async function publishContent() {
  if (!currentFile) return;
  showModal(`<h2>发布内容</h2><div class="modal-body"><p>步骤 1/3: 保存到草稿分支...</p><div id="publish-steps"></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" id="publish-confirm-btn" onclick="executePublish()">开始发布</button></div>`);
}
async function executePublish() {
  const steps = document.getElementById('publish-steps');
  try {
    steps.innerHTML = '<div>⏳ 保存到草稿分支...</div>';
    await saveDraft();
    steps.innerHTML = '<div>✅ 已保存草稿</div><div>⏳ 生成预览差异...</div>';
    let mainContent = '', draftContent = '';
    try { const r = await apiFetch('/repos/' + REPO + '/contents/' + currentFile); if (r.ok) mainContent = b64decode((await r.json()).content)||''; } catch(e){}
    try { const r = await apiFetch('/repos/' + REPO + '/contents/' + currentFile + '?ref=draft'); if (r.ok) draftContent = b64decode((await r.json()).content)||''; } catch(e){}
    const diff = generateDiff(mainContent, draftContent);
    steps.innerHTML = '<div>✅ 已保存草稿</div><div>✅ 差异已生成</div><div style="margin-top:12px"><strong>步骤 2/3: 预览差异</strong></div>';
    showModal(`<h2>发布预览</h2><div class="modal-body"><p>以下是将要发布到 main 分支的更改：</p><div class="diff-view" style="max-height:400px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px">${diff}</div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="executeMerge()">步骤 3/3: 确认发布</button></div>`, true);
  } catch(e) { showToast(e.message, 'error'); }
}
function generateDiff(oldText, newText) {
  const oldLines = oldText.split('\n'), newLines = newText.split('\n');
  let html = '';
  const maxLen = Math.max(oldLines.length, newLines.length);
  for (let i = 0; i < maxLen; i++) {
    const o = oldLines[i], n = newLines[i];
    if (o === n) html += `<div class="diff-line diff-ctx"> ${escapeHtml(n||'')}</div>`;
    else { if (o !== undefined) html += `<div class="diff-line diff-del">- ${escapeHtml(o)}</div>`; if (n !== undefined) html += `<div class="diff-line diff-add">+ ${escapeHtml(n)}</div>`; }
  }
  return html || '<div style="color:var(--muted)">无差异</div>';
}
async function executeMerge() {
  closeModal(); showLoading('合并到 main...');
  try {
    const res = await apiFetch('/repos/' + REPO + '/merges', { method: 'POST', body: { base: 'main', head: 'draft', commit_message: '发布: ' + currentFile } });
    if (!res.ok) throw new Error('合并失败');
    showToast('已发布到 main');
    const el = document.getElementById('draft-indicator'); if (el) el.style.display = 'none';
    triggerDeploy();
  } catch(e) { showToast(e.message, 'error'); } finally { hideLoading(); }
}
async function showVersionHistory(path) {
  showModal(`<h2>版本历史</h2><div class="modal-body"><div class="loading"></div></div>`, true);
  try {
    const res = await apiFetch('/repos/' + REPO + '/commits?path=' + encodeURIComponent(path) + '&per_page=20');
    if (!res.ok) throw new Error('获取历史失败');
    const commits = await res.json();
    const html = commits.map(c => `<li><div class="commit-msg">${escapeHtml(c.commit.message.split('\n')[0])}</div><div class="commit-meta"><span>${c.commit.author?.name||''}</span><span>${formatDate(c.commit.author?.date)}</span><div class="commit-actions"><button class="btn btn-outline btn-sm" onclick="viewCommitVersion('${path}','${c.sha}')">查看</button><button class="btn btn-outline btn-sm" onclick="rollbackFile('${path}','${c.sha}')">回滚</button></div></div></li>`).join('');
    showModal(`<h2>版本历史 · ${path}</h2><div class="modal-body"><ul class="commit-list">${html}</ul></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>`, true);
  } catch(e) { showToast(e.message, 'error'); closeModal(); }
}
async function viewCommitVersion(path, sha) {
  showLoading('获取版本内容...');
  try {
    const res = await apiFetch('/repos/' + REPO + '/contents/' + path + '?ref=' + sha);
    if (!res.ok) throw new Error('获取失败');
    const data = await res.json();
    const content = b64decode(data.content) || '';
    showModal(`<h2>版本内容 · ${sha.substring(0,7)}</h2><div class="modal-body"><pre style="white-space:pre-wrap;max-height:400px;overflow-y:auto;background:#f5f3ed;padding:12px;border-radius:6px;font-size:12px">${escapeHtml(content)}</pre></div><div class="modal-footer"><button class="btn btn-outline" onclick="showVersionHistory('${path}')">返回</button></div>`, true);
  } catch(e) { showToast(e.message, 'error'); } finally { hideLoading(); }
}
async function rollbackFile(path, sha) {
  confirmDialog('回滚文件', `确定将 <code>${path}</code> 回滚到 ${sha.substring(0,7)} 吗？`, async () => {
    showLoading('回滚中...');
    try {
      const vRes = await apiFetch('/repos/' + REPO + '/contents/' + path + '?ref=' + sha);
      if (!vRes.ok) throw new Error('获取版本失败');
      const vData = await vRes.json();
      const content = b64decode(vData.content) || '';
      const fRes = await apiFetch('/repos/' + REPO + '/contents/' + path);
      let fileSha; if (fRes.ok) { const fData = await fRes.json(); fileSha = fData.sha; }
      const res = await apiFetch('/repos/' + REPO + '/contents/' + path, { method: 'PUT', body: { message: '回滚到 ' + sha.substring(0,7), content: b64encode(content), sha: fileSha } });
      if (res.ok) { showToast('已回滚'); closeModal(); openFile(path); } else throw new Error('回滚失败');
    } catch(e) { showToast(e.message, 'error'); } finally { hideLoading(); }
  });
}
async function triggerDeploy() {
  showLoading('触发部署...');
  try {
    const wfRes = await apiFetch('/repos/' + REPO + '/actions/workflows');
    let workflowId = 'deploy.yml';
    if (wfRes.ok) { const wfs = await wfRes.json(); if (wfs.workflows?.length) workflowId = wfs.workflows[0].id; }
    const res = await apiFetch('/repos/' + REPO + '/actions/workflows/' + workflowId + '/dispatches', { method: 'POST', body: { ref: 'main', inputs: {} } });
    if (res.ok || res.status === 204) showToast('部署已触发'); else { const d = await res.json().catch(()=>({})); throw new Error(d.message || '触发失败 (' + res.status + ')'); }
  } catch(e) { showToast('部署触发: ' + e.message, 'warning'); } finally { hideLoading(); }
}

async function loadSettings() {
  const pane = document.getElementById('pane-settings');
  let configContent = '', deployHtml = '<div class="deploy-status idle">未触发部署</div>';
  try {
    const res = await apiFetch('/repos/' + REPO + '/contents/.vitepress/config.ts');
    if (res.ok) { const data = await res.json(); configContent = b64decode(data.content) || ''; }
  } catch(e) {}
  try {
    const r = await apiFetch('/repos/' + REPO + '/actions/runs?per_page=5');
    if (r.ok) { const runs = await r.json(); if (runs.workflow_runs?.length) { deployHtml = runs.workflow_runs.slice(0,5).map(run => `<div class="deploy-status ${run.status==='completed'?(run.conclusion==='success'?'success':'failed'):'running'}"> ${run.status==='completed'?(run.conclusion==='success'?'✅':'❌'):'⏳'} ${escapeHtml(run.name)} · ${run.status} · ${formatDate(run.created_at)}</div>`).join(''); } }
  } catch(e) {}
  let tplHtml = '';
  for (const [name, tpl] of Object.entries(TEMPLATES)) tplHtml += `<div class="template-card"><h4>${name}</h4><p>${tpl.sections.join(' · ')}</p></div>`;
  pane.innerHTML = `<div class="settings-section"><h3>⚙️ VitePress 配置</h3><p style="margin-bottom:12px;color:var(--muted)">编辑 .vitepress/config.ts</p><textarea class="config-editor" id="config-editor">${escapeHtml(configContent)}</textarea><div style="margin-top:12px"><button class="btn btn-primary" onclick="saveConfig()">保存配置</button></div></div>
  <div class="settings-section"><h3>📋 页面模板</h3><div class="template-grid">${tplHtml}</div></div>
  <div class="settings-section"><h3>🚀 部署</h3>${deployHtml}<div style="margin-top:12px"><button class="btn btn-primary" onclick="triggerDeploy()">一键部署</button></div></div>`;
}
async function saveConfig() {
  const content = document.getElementById('config-editor').value;
  showLoading('保存配置...');
  try {
    const res = await apiFetch('/repos/' + REPO + '/contents/.vitepress/config.ts');
    let sha; if (res.ok) sha = (await res.json()).sha;
    const putRes = await apiFetch('/repos/' + REPO + '/contents/.vitepress/config.ts', { method: 'PUT', body: { message: '更新 VitePress 配置', content: b64encode(content), sha } });
    if (putRes.ok) showToast('配置已保存'); else throw new Error('保存失败');
  } catch(e) { showToast(e.message, 'error'); } finally { hideLoading(); }
}

if (token) { document.getElementById('token-input').value = token; doLogin(); }
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });
